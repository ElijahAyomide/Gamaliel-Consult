# Decap CMS configuration for the Gamaliel Consult admin (/admin).
# Editors sign in through Decap Turbo (email + password). See README.md for the one-time setup.
backend:
  name: turbo-github
  turbo_site_id: YOUR_TURBO_SITE_ID   # <- replace with the Site ID from turbo.decapcms.org

media_folder: images/uploads
public_folder: /images/uploads
logo_url: /images/logo.png
locale: en

collections:
  - name: posts
    label: "Blog posts"
    label_singular: "Blog post"
    folder: content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - {label: "Drafts", field: draft, pattern: true}
    fields:
      - {label: "Title", name: title, widget: string}
      - {label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true}
      - label: "Category label"
        name: category
        widget: select
        options: ["Corporate & commercial", "Dispute resolution", "Property & real estate", "Employment & workplace", "Family & private client", "Regulatory & compliance"]
        hint: "The small gold label above the title."
      - label: "Filter group"
        name: topic
        widget: select
        options: ["Business", "Disputes", "Property", "Private client"]
        hint: "Which filter button on the Blog page shows this post."
      - {label: "Reading time", name: read_time, widget: string, hint: "For example: 5 min read"}
      - {label: "Short summary", name: excerpt, widget: text, hint: "One or two sentences shown on the post cards and in Google results."}
      - {label: "Cover image", name: image, widget: image, hint: "Landscape photo, at least 1200 px wide."}
      - {label: "Cover image description", name: image_alt, widget: string, required: false, hint: "Short description for screen readers."}
      - {label: "Featured post", name: featured, widget: boolean, default: false, required: false, hint: "The featured post appears in the large panel at the top of the Blog page. Only one post should be featured."}
      - {label: "Draft (hide from website)", name: draft, widget: boolean, default: false, required: false}
      - {label: "Article text", name: body, widget: markdown, hint: "Write the article here. The first paragraph is shown slightly larger. Use Heading 2 for section titles."}

  - name: settings
    label: "Contact details & site settings"
    files:
      - name: settings
        label: "Contact details, footer & call-to-action"
        file: content/settings.json
        format: json
        fields:
          - label: "Email"
            name: email
            widget: string
            required: false
            hint: "Shown on the Contact page and in the footer. (Messages sent through the contact form are emailed to the address set in Netlify, see the README.)"
          - label: "Phone"
            name: phone
            widget: string
            required: false
            hint: "Shown on the Contact page, e.g. 08145686089."
          - label: "Phone for tap to call"
            name: phone_for_tap_to_call
            widget: string
            required: false
            hint: "International format, e.g. +2348145686089. Leave empty to use the phone number above."
          - label: "Whatsapp number"
            name: whatsapp_number
            widget: string
            required: false
            hint: "Digits only with the country code, e.g. 2348145686089 (no + sign or spaces)."
          - label: "Linkedin url"
            name: linkedin_url
            widget: string
            required: false
            hint: "Full address of your LinkedIn page. Leave empty to hide the LinkedIn link in the footer."
          - label: "Address"
            name: address
            widget: text
            required: false
            hint: "Optional. Shown in the footer when filled in."
          - label: "Footer tagline"
            name: footer_tagline
            widget: text
            required: false
